[package]
name = "mjolnir_agent"
version = "1.3.0"
edition = "2021"
description = "Mjölnir client agent: local IPC intake + optional server telemetry forwarder"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
